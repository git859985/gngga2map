<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GNSS 即時軌跡監控</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body, #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    /* 懸浮資訊面板 */
    .status-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 14px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      width: calc(100% - 24px);
      max-width: 320px;
      backdrop-filter: blur(5px);
    }
    
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .panel-header h3 {
      font-size: 15px;
      font-weight: 600;
      color: #333;
    }
    .clear-btn {
      background: #6c757d;
      color: #fff;
      border: none;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .clear-btn:hover {
      background: #5a6268;
    }
    
    .status-content {
      font-size: 13px;
      color: #444;
      line-height: 1.6;
    }
    .status-badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 4px;
      font-weight: 600;
      color: #fff;
      background: #6c757d;
      font-size: 12px;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #222;
    }
    .sub-info {
      font-size: 11px;
      color: #777;
      margin-top: 3px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="status-panel">
    <div class="panel-header">
      <h3>GNSS 即時監控</h3>
      <button class="clear-btn" id="btnClear">清除軌跡</button>
    </div>
    
    <div class="status-content">
      <div>狀態：<span class="status-badge" id="fixBadge">連線中...</span></div>
      <div>座標：<span class="mono" id="posText">尚未取得</span></div>
      <div>數據：<span class="mono" id="satAltText">-</span></div>
      <div class="sub-info" id="updateText">等待資料封包...</div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- MQTT.js CDN -->
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>

  <script>
    // ==========================================
    // 寫死連線參數設定
    // ==========================================
    const MQTT_CONFIG = {
      host: 'wss://mqttgo.vip:8084/mqtt',
      topic: '/user/rock859985/RTK/KY8688E0/log',
      username: '', // 若需要帳號驗證請填入
      password: ''  // 若需要密碼驗證請填入
    };

    // ==========================================
    // 1. 初始化 Leaflet 地圖與圖層
    // ==========================================
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([23.97, 120.97], 7);

    // Google 地圖圖層
    const googleRoadmap = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 21 });
    const googleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 21 });
    const osmMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });

    googleRoadmap.addTo(map);

    L.control.layers({
      "Google 街道圖": googleRoadmap,
      "Google 混合衛星圖": googleSatellite,
      "OpenStreetMap": osmMap
    }, null, { position: 'bottomright' }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ==========================================
    // 2. 軌跡、標記與狀態色碼
    // ==========================================
    let polyline = L.polyline([], { color: '#007bff', weight: 4, opacity: 0.8 }).addTo(map);
    let marker = null;
    let autoCenter = true;

    // 手動拖曳地圖時暫停視角自動跟隨
    map.on('dragstart', () => { autoCenter = false; });

    const fixModes = {
      0: { text: "未定位 (Invalid)", color: "#6c757d" },
      1: { text: "單點定位 (Single)", color: "#17a2b8" },
      2: { text: "差分定位 (DGPS)", color: "#28a745" },
      4: { text: "RTK 固定解 (Fixed)", color: "#00c853" },
      5: { text: "RTK 浮點解 (Float)", color: "#ff9800" },
      6: { text: "航位推算 (DR)", color: "#9c27b0" }
    };

    function updateMarker(lat, lng, modeCode) {
      const mode = fixModes[modeCode] || { text: `模式 ${modeCode}`, color: "#333" };

      if (!marker) {
        marker = L.circleMarker([lat, lng], {
          radius: 8,
          fillColor: mode.color,
          color: "#ffffff",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.95
        }).addTo(map);
      } else {
        marker.setLatLng([lat, lng]);
        marker.setStyle({ fillColor: mode.color });
      }

      polyline.addLatLng([lat, lng]);

      if (autoCenter) {
        map.setView([lat, lng], 18);
      }
    }

    // ==========================================
    // 3. NMEA GNGGA 解析邏輯
    // ==========================================
    function parseGNGGA(sentence) {
      const raw = sentence.trim();
      if (!raw.includes('GGA')) return null;

      const ggaMatch = raw.match(/\$G[NPBLA]GGA,[^\*]*/);
      if (!ggaMatch) return null;

      const tokens = ggaMatch[0].split(',');
      if (tokens.length < 10) return null;

      const rawLat = tokens[2];
      const latDir = tokens[3];
      const rawLng = tokens[4];
      const lngDir = tokens[5];
      const fixQuality = parseInt(tokens[6], 10);
      const satCount = tokens[7];
      const hdop = tokens[8];
      const altitude = tokens[9];

      if (!rawLat || !rawLng || isNaN(fixQuality) || fixQuality === 0) {
        return null;
      }

      // ddmm.mmmm -> dd.dddddd
      const latDeg = parseFloat(rawLat.substring(0, 2));
      const latMin = parseFloat(rawLat.substring(2));
      let lat = latDeg + (latMin / 60.0);
      if (latDir === 'S') lat = -lat;

      const lngDeg = parseFloat(rawLng.substring(0, 3));
      const lngMin = parseFloat(rawLng.substring(3));
      let lng = lngDeg + (lngMin / 60.0);
      if (lngDir === 'W') lng = -lng;

      return {
        lat: lat,
        lng: lng,
        fixQuality: fixQuality,
        satCount: satCount,
        hdop: hdop,
        altitude: altitude
      };
    }

    // ==========================================
    // 4. MQTT 自動連線
    // ==========================================
    const fixBadge = document.getElementById('fixBadge');
    const posText = document.getElementById('posText');
    const satAltText = document.getElementById('satAltText');
    const updateText = document.getElementById('updateText');
    const btnClear = document.getElementById('btnClear');

    btnClear.addEventListener('click', () => {
      polyline.setLatLngs([]);
      if (marker) {
        map.removeLayer(marker);
        marker = null;
      }
      posText.innerText = "已清除";
      satAltText.innerText = "-";
      autoCenter = true;
    });

    function startMQTT() {
      const options = {
        clientId: 'web_' + Math.random().toString(16).substring(2, 10),
        clean: true,
        connectTimeout: 8000,
        reconnectPeriod: 4000
      };

      if (MQTT_CONFIG.username) options.username = MQTT_CONFIG.username;
      if (MQTT_CONFIG.password) options.password = MQTT_CONFIG.password;

      fixBadge.innerText = "連線中...";
      fixBadge.style.backgroundColor = "#ffc107";

      const client = mqtt.connect(MQTT_CONFIG.host, options);

      client.on('connect', () => {
        fixBadge.innerText = "已連線";
        fixBadge.style.backgroundColor = "#17a2b8";
        updateText.innerText = `已訂閱 Topic`;
        client.subscribe(MQTT_CONFIG.topic);
      });

      client.on('message', (topic, payload) => {
        const msgStr = payload.toString();
        const data = parseGNGGA(msgStr);

        if (data) {
          const modeInfo = fixModes[data.fixQuality] || { text: `模式 ${data.fixQuality}`, color: "#333" };
          
          fixBadge.innerText = modeInfo.text;
          fixBadge.style.backgroundColor = modeInfo.color;
          posText.innerText = `${data.lat.toFixed(7)}, ${data.lng.toFixed(7)}`;
          satAltText.innerText = `衛數: ${data.satCount} | 高程: ${data.altitude}m | HDOP: ${data.hdop}`;
          updateText.innerText = `更新時間: ${new Date().toLocaleTimeString()}`;

          updateMarker(data.lat, data.lng, data.fixQuality);
        }
      });

      client.on('error', (err) => {
        fixBadge.innerText = "連線錯誤";
        fixBadge.style.backgroundColor = "#dc3545";
        updateText.innerText = err.message || "連線異常";
      });

      client.on('close', () => {
        fixBadge.innerText = "重連中...";
        fixBadge.style.backgroundColor = "#6c757d";
      });
    }

    // 頁面載入完成即啟動
    window.addEventListener('DOMContentLoaded', startMQTT);
  </script>
</body>
</html>
