<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GNSS 即時軌跡監控 (RMC + GGA + GST)</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body, #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    .status-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      padding: 12px 14px;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.25);
      width: calc(100% - 24px);
      max-width: 340px;
      backdrop-filter: blur(5px);
    }
    
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .panel-header h3 {
      font-size: 15px;
      font-weight: 600;
      color: #111;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .panel-btn {
      border: none;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      color: #fff;
    }
    .clear-btn {
      background: #dc3545;
    }
    .clear-btn:hover {
      background: #c82333;
    }
    .center-btn {
      background: #6c757d;
    }
    .center-btn.active {
      background: #198754;
    }
    
    .status-content {
      font-size: 13px;
      color: #222;
      line-height: 1.6;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      color: #fff;
      background: #6c757d;
      font-size: 12px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #111;
    }
    .gst-highlight {
      color: #d63384;
      font-weight: 600;
    }
    .motion-highlight {
      color: #0d6efd;
      font-weight: 600;
    }
    .sub-info {
      font-size: 11px;
      color: #666;
      margin-top: 5px;
      border-top: 1px solid #eee;
      padding-top: 4px;
    }
    
    .heading-icon {
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="status-panel">
    <div class="panel-header">
      <h3>GNSS 航跡監控</h3>
      <div class="btn-group">
        <button class="panel-btn center-btn active" id="btnRecenter">鎖定跟隨</button>
        <button class="panel-btn clear-btn" id="btnClear">清除航跡</button>
      </div>
    </div>
    
    <div class="status-content">
      <div>解算：<span class="status-badge" id="fixBadge">連線中...</span></div>
      <div>座標：<span class="mono" id="posText">尚未取得</span></div>
      <div>數據：<span class="mono" id="satAltText">-</span></div>
      <div>航行：<span class="mono motion-highlight" id="motionText">速度: - | 航向: -</span></div>
      <div>精度 (GST)：<span class="mono gst-highlight" id="gstText">等待 GST...</span></div>
      <div>點數 / 航程：<span class="mono" id="trackStats">0 點 / 0.0 m</span></div>
      <div class="sub-info" id="updateText">等待 NMEA 封包...</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>

  <script>
    // ==========================================
    // 寫死連線參數設定
    // ==========================================
    const MQTT_CONFIG = {
      host: 'wss://mqttgo.vip:8084/mqtt',
      topic: '/user/rock859985/RTK/KY8688E0/log',
      username: '',
      password: ''
    };

    const TRACK_COLOR = '#FF0000'; // 一律純紅軌跡

    // ==========================================
    // 1. 初始化 Leaflet 地圖
    // ==========================================
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([23.9469, 120.6615], 17);

    const googleRoadmap = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 22 });
    const googleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 22 });
    const osmMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });

    googleRoadmap.addTo(map);

    L.control.layers({
      "Google 街道圖": googleRoadmap,
      "Google 混合衛星圖": googleSatellite,
      "OpenStreetMap": osmMap
    }, null, { position: 'bottomright' }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ==========================================
    // 2. 標記、航向與跟隨控制
    // ==========================================
    const fixModes = {
      0: { text: "未定位", color: "#6c757d" },
      1: { text: "單點 (Single)", color: "#007bff" },
      2: { text: "差分 (DGPS)", color: "#17a2b8" },
      4: { text: "RTK 固定解 (Fixed)", color: "#28a745" },
      5: { text: "RTK 浮點解 (Float)", color: "#fd7e14" },
      6: { text: "航位推算", color: "#6f42c1" }
    };

    const trackLayerGroup = L.layerGroup().addTo(map);
    
    let currentMarker = null;
    let headingMarker = null;
    let startMarker = null;
    let lastPoint = null;
    let currentHeading = null;
    let totalPoints = 0;
    let totalDistance = 0;
    let autoCenter = true; // 跟隨狀態開關

    const btnRecenter = document.getElementById('btnRecenter');

    function updateFollowState(state) {
      autoCenter = state;
      if (autoCenter) {
        btnRecenter.classList.add('active');
        btnRecenter.innerText = "鎖定跟隨";
        if (lastPoint) {
          map.panTo([lastPoint.lat, lastPoint.lng], { animate: true });
        }
      } else {
        btnRecenter.classList.remove('active');
        btnRecenter.innerText = "自由瀏覽";
      }
    }

    // 當手動拖曳地圖或滾輪放大縮小時，立即停止強制置中
    map.on('dragstart', () => { updateFollowState(false); });
    map.on('zoomstart', () => { updateFollowState(false); });

    btnRecenter.addEventListener('click', () => {
      updateFollowState(!autoCenter);
    });

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function createHeadingIcon(degree) {
      const svg = `
        <svg viewBox="0 0 32 32" width="28" height="28" style="transform: rotate(${degree}deg); transform-origin: center center;">
          <polygon points="16,2 26,28 16,21 6,28" fill="#FF0000" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      `;
      return L.divIcon({
        className: 'heading-icon',
        html: svg,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
    }

    function addTrackPoint(lat, lng, modeCode) {
      const currentLatLng = [lat, lng];

      if (lastPoint) {
        const segDist = calcDistance(lastPoint.lat, lastPoint.lng, lat, lng);
        totalDistance += segDist;

        // 白色加粗底框 (8px)
        L.polyline([[lastPoint.lat, lastPoint.lng], currentLatLng], {
          color: '#ffffff',
          weight: 8,
          opacity: 0.9,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(trackLayerGroup);

        // 純紅色航跡 (5px)
        L.polyline([[lastPoint.lat, lastPoint.lng], currentLatLng], {
          color: TRACK_COLOR,
          weight: 5,
          opacity: 1.0,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(trackLayerGroup);
      } else {
        startMarker = L.circleMarker(currentLatLng, {
          radius: 7,
          fillColor: "#ffffff",
          color: "#000000",
          weight: 3,
          opacity: 1,
          fillOpacity: 1
        }).addTo(trackLayerGroup).bindPopup("航跡起點");
      }

      // 當前位置純紅點
      if (!currentMarker) {
        currentMarker = L.circleMarker(currentLatLng, {
          radius: 6,
          fillColor: TRACK_COLOR,
          color: "#ffffff",
          weight: 2,
          opacity: 1,
          fillOpacity: 1
        }).addTo(map);
      } else {
        currentMarker.setLatLng(currentLatLng);
      }

      // 即時航向箭頭
      if (currentHeading !== null) {
        if (!headingMarker) {
          headingMarker = L.marker(currentLatLng, {
            icon: createHeadingIcon(currentHeading),
            zIndexOffset: 1000
          }).addTo(map);
        } else {
          headingMarker.setLatLng(currentLatLng);
          headingMarker.setIcon(createHeadingIcon(currentHeading));
        }
      }

      lastPoint = { lat, lng };
      totalPoints++;

      const distStr = totalDistance > 1000 ? `${(totalDistance / 1000).toFixed(2)} km` : `${totalDistance.toFixed(1)} m`;
      document.getElementById('trackStats').innerText = `${totalPoints} 點 / ${distStr}`;

      // 使用 panTo 平移中心點，絕不更動使用者手動調好的放大比例
      if (autoCenter) {
        map.panTo(currentLatLng, { animate: true, duration: 0.5 });
      }
    }

    // ==========================================
    // 3. NMEA 解析器 (RMC / GGA / GST)
    // ==========================================
    function parseGNRMC(line) {
      const match = line.match(/\$G[NPBLA]RMC,[^\*]*/);
      if (!match) return null;

      const tokens = match[0].split(',');
      if (tokens.length < 9) return null;

      const status = tokens[2];
      const speedKnots = parseFloat(tokens[7]);
      const headingTrue = parseFloat(tokens[8]);

      return {
        isValid: status === 'A',
        speedKnots: isNaN(speedKnots) ? 0 : speedKnots,
        speedKmh: isNaN(speedKnots) ? 0 : (speedKnots * 1.852),
        heading: isNaN(headingTrue) ? null : headingTrue
      };
    }

    function parseGNGGA(line) {
      const match = line.match(/\$G[NPBLA]GGA,[^\*]*/);
      if (!match) return null;

      const tokens = match[0].split(',');
      if (tokens.length < 10) return null;

      const rawLat = tokens[2];
      const latDir = tokens[3];
      const rawLng = tokens[4];
      const lngDir = tokens[5];
      const fixQuality = parseInt(tokens[6], 10);
      const satCount = tokens[7];
      const hdop = tokens[8];
      const altitude = tokens[9];

      if (!rawLat || !rawLng || isNaN(fixQuality) || fixQuality === 0) {
        return null;
      }

      const latDeg = parseFloat(rawLat.substring(0, 2));
      const latMin = parseFloat(rawLat.substring(2));
      let lat = latDeg + (latMin / 60.0);
      if (latDir === 'S') lat = -lat;

      const lngDeg = parseFloat(rawLng.substring(0, 3));
      const lngMin = parseFloat(rawLng.substring(3));
      let lng = lngDeg + (lngMin / 60.0);
      if (lngDir === 'W') lng = -lng;

      return { lat, lng, fixQuality, satCount, hdop, altitude };
    }

    function parseGNGST(line) {
      const match = line.match(/\$G[NPBLA]GST,[^\*]*/);
      if (!match) return null;

      const tokens = match[0].split(',');
      if (tokens.length < 9) return null;

      const latStd = parseFloat(tokens[6]);
      const lonStd = parseFloat(tokens[7]);
      const altStd = parseFloat(tokens[8]);

      if (isNaN(latStd) || isNaN(lonStd)) return null;

      const hAcc = Math.sqrt(latStd * latStd + lonStd * lonStd);

      return {
        latStd: latStd,
        lonStd: lonStd,
        altStd: isNaN(altStd) ? null : altStd,
        hAcc: hAcc
      };
    }

    // ==========================================
    // 4. MQTT 批次多行處理
    // ==========================================
    const fixBadge = document.getElementById('fixBadge');
    const posText = document.getElementById('posText');
    const satAltText = document.getElementById('satAltText');
    const motionText = document.getElementById('motionText');
    const gstText = document.getElementById('gstText');
    const updateText = document.getElementById('updateText');
    const btnClear = document.getElementById('btnClear');

    btnClear.addEventListener('click', () => {
      trackLayerGroup.clearLayers();
      if (currentMarker) { map.removeLayer(currentMarker); currentMarker = null; }
      if (headingMarker) { map.removeLayer(headingMarker); headingMarker = null; }
      lastPoint = null;
      currentHeading = null;
      totalPoints = 0;
      totalDistance = 0;
      document.getElementById('trackStats').innerText = "0 點 / 0.0 m";
      posText.innerText = "已清除";
      satAltText.innerText = "-";
      motionText.innerText = "速度: - | 航向: -";
      gstText.innerText = "等待 GST...";
      updateFollowState(true);
    });

    function startMQTT() {
      const options = {
        clientId: 'web_marine_' + Math.random().toString(16).substring(2, 10),
        clean: true,
        connectTimeout: 8000,
        reconnectPeriod: 4000
      };

      if (MQTT_CONFIG.username) options.username = MQTT_CONFIG.username;
      if (MQTT_CONFIG.password) options.password = MQTT_CONFIG.password;

      fixBadge.innerText = "連線中...";
      fixBadge.style.backgroundColor = "#ffc107";

      const client = mqtt.connect(MQTT_CONFIG.host, options);

      client.on('connect', () => {
        fixBadge.innerText = "已連線";
        fixBadge.style.backgroundColor = "#17a2b8";
        updateText.innerText = `已訂閱: ${MQTT_CONFIG.topic}`;
        client.subscribe(MQTT_CONFIG.topic);
      });

      client.on('message', (topic, payload) => {
        const payloadStr = payload.toString();
        const lines = payloadStr.split(/\r?\n/);
        
        let pendingGGA = null;
        let pendingGST = null;
        let pendingRMC = null;

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;

          if (line.includes('RMC')) {
            const parsed = parseGNRMC(line);
            if (parsed) pendingRMC = parsed;
          } else if (line.includes('GGA')) {
            const parsed = parseGNGGA(line);
            if (parsed) pendingGGA = parsed;
          } else if (line.includes('GST')) {
            const parsed = parseGNGST(line);
            if (parsed) pendingGST = parsed;
          }
        }

        // 1. 處理 RMC 速度與航向
        if (pendingRMC) {
          if (pendingRMC.heading !== null) {
            currentHeading = pendingRMC.heading;
          }
          const knotStr = pendingRMC.speedKnots.toFixed(2);
          const kmhStr = pendingRMC.speedKmh.toFixed(2);
          const hdgStr = pendingRMC.heading !== null ? `${pendingRMC.heading.toFixed(1)}°` : '-';
          motionText.innerText = `${kmhStr} km/h (${knotStr} kn) | 航向: ${hdgStr}`;
        }

        // 2. 處理 GST 精度
        if (pendingGST) {
          const hAccCm = (pendingGST.hAcc * 100).toFixed(1);
          const vAccCm = pendingGST.altStd !== null ? (pendingGST.altStd * 100).toFixed(1) : '-';
          gstText.innerText = `水平: ±${hAccCm} cm | 垂直: ±${vAccCm} cm`;
        }

        // 3. 處理 GGA 座標與劃記
        if (pendingGGA) {
          const modeInfo = fixModes[pendingGGA.fixQuality] || { text: `模式 ${pendingGGA.fixQuality}`, color: "#007bff" };
          fixBadge.innerText = modeInfo.text;
          fixBadge.style.backgroundColor = modeInfo.color;
          posText.innerText = `${pendingGGA.lat.toFixed(8)}, ${pendingGGA.lng.toFixed(8)}`;
          satAltText.innerText = `衛數: ${pendingGGA.satCount} | 高程: ${pendingGGA.altitude}m | HDOP: ${pendingGGA.hdop}`;

          addTrackPoint(pendingGGA.lat, pendingGGA.lng, pendingGGA.fixQuality);
          updateText.innerText = `最後更新: ${new Date().toLocaleTimeString()}`;
        }
      });

      client.on('error', (err) => {
        fixBadge.innerText = "連線錯誤";
        fixBadge.style.backgroundColor = "#dc3545";
        updateText.innerText = err.message || "連線異常";
      });

      client.on('close', () => {
        fixBadge.innerText = "重連中...";
        fixBadge.style.backgroundColor = "#6c757d";
      });
    }

    window.addEventListener('DOMContentLoaded', startMQTT);
  </script>
</body>
</html>
