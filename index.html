<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GNSS 即時海事軌跡監控</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body, #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    /* 懸浮資訊面板 */
    .status-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 14px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      width: calc(100% - 24px);
      max-width: 320px;
      backdrop-filter: blur(5px);
    }
    
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .panel-header h3 {
      font-size: 15px;
      font-weight: 600;
      color: #222;
    }
    .clear-btn {
      background: #dc3545;
      color: #fff;
      border: none;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    .clear-btn:hover {
      background: #c82333;
    }
    
    .status-content {
      font-size: 13px;
      color: #333;
      line-height: 1.6;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      color: #fff;
      background: #6c757d;
      font-size: 12px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #111;
    }
    .sub-info {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      border-top: 1px solid #eee;
      padding-top: 4px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="status-panel">
    <div class="panel-header">
      <h3>GNSS 航跡監控</h3>
      <button class="clear-btn" id="btnClear">清除航跡</button>
    </div>
    
    <div class="status-content">
      <div>解算：<span class="status-badge" id="fixBadge">連線中...</span></div>
      <div>座標：<span class="mono" id="posText">尚未取得</span></div>
      <div>數據：<span class="mono" id="satAltText">-</span></div>
      <div>點數 / 航程：<span class="mono" id="trackStats">0 點 / 0.0 m</span></div>
      <div class="sub-info" id="updateText">等待 NMEA 資料中...</div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- MQTT.js CDN -->
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>

  <script>
    // ==========================================
    // 寫死連線參數設定
    // ==========================================
    const MQTT_CONFIG = {
      host: 'wss://mqttgo.vip:8084/mqtt',
      topic: '/user/rock859985/RTK/KY8688E0/log',
      username: '',
      password: ''
    };

    const TRACK_COLOR = '#FF0000'; // 一律使用純紅色

    // ==========================================
    // 1. 初始化 Leaflet 地圖
    // ==========================================
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([22.61, 120.28], 15);

    // Google 地圖圖層
    const googleRoadmap = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 22 });
    const googleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 22 });
    const osmMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });

    googleRoadmap.addTo(map);

    L.control.layers({
      "Google 街道圖": googleRoadmap,
      "Google 混合衛星圖": googleSatellite,
      "OpenStreetMap": osmMap
    }, null, { position: 'bottomright' }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ==========================================
    // 2. 狀態定義與標記管理
    // ==========================================
    const fixModes = {
      0: { text: "未定位", color: "#6c757d" },
      1: { text: "單點 (Single)", color: "#FF0000" },
      2: { text: "差分 (DGPS)", color: "#FF0000" },
      4: { text: "RTK 固定解 (Fixed)", color: "#FF0000" },
      5: { text: "RTK 浮點解 (Float)", color: "#FF0000" },
      6: { text: "航位推算", color: "#FF0000" }
    };

    const trackLayerGroup = L.layerGroup().addTo(map);
    
    let currentMarker = null;
    let startMarker = null;
    let lastPoint = null;
    let totalPoints = 0;
    let totalDistance = 0;
    let autoCenter = true;

    map.on('dragstart', () => { autoCenter = false; });

    // 大圓航線距離計算 (公尺)
    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function addTrackPoint(lat, lng, modeCode) {
      const mode = fixModes[modeCode] || { text: `模式 ${modeCode}`, color: TRACK_COLOR };
      const currentLatLng = [lat, lng];

      if (lastPoint) {
        const segDist = calcDistance(lastPoint.lat, lastPoint.lng, lat, lng);
        totalDistance += segDist;

        // 底層白色邊框 (寬度 8px)，加強反差
        L.polyline([[lastPoint.lat, lastPoint.lng], currentLatLng], {
          color: '#ffffff',
          weight: 8,
          opacity: 0.9,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(trackLayerGroup);

        // 頂層主要航跡線 (純紅色，寬度 5px)
        L.polyline([[lastPoint.lat, lastPoint.lng], currentLatLng], {
          color: TRACK_COLOR,
          weight: 5,
          opacity: 1.0,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(trackLayerGroup);
      } else {
        // 航跡起點標記
        startMarker = L.circleMarker(currentLatLng, {
          radius: 7,
          fillColor: "#ffffff",
          color: "#000000",
          weight: 3,
          opacity: 1,
          fillOpacity: 1
        }).addTo(trackLayerGroup).bindPopup("航跡起點");
      }

      // 即時船位/設備標記 (純紅色實心圓，白邊框)
      if (!currentMarker) {
        currentMarker = L.circleMarker(currentLatLng, {
          radius: 9,
          fillColor: TRACK_COLOR,
          color: "#ffffff",
          weight: 2,
          opacity: 1,
          fillOpacity: 1
        }).addTo(map);
      } else {
        currentMarker.setLatLng(currentLatLng);
        currentMarker.setStyle({ fillColor: TRACK_COLOR });
      }

      lastPoint = { lat, lng };
      totalPoints++;

      const distStr = totalDistance > 1000 ? `${(totalDistance / 1000).toFixed(2)} km` : `${totalDistance.toFixed(1)} m`;
      document.getElementById('trackStats').innerText = `${totalPoints} 點 / ${distStr}`;

      if (autoCenter) {
        map.setView(currentLatLng, 18);
      }
    }

    // ==========================================
    // 3. NMEA GNGGA 解析
    // ==========================================
    function parseGNGGA(sentence) {
      const raw = sentence.trim();
      if (!raw.includes('GGA')) return null;

      const ggaMatch = raw.match(/\$G[NPBLA]GGA,[^\*]*/);
      if (!ggaMatch) return null;

      const tokens = ggaMatch[0].split(',');
      if (tokens.length < 10) return null;

      const rawLat = tokens[2];
      const latDir = tokens[3];
      const rawLng = tokens[4];
      const lngDir = tokens[5];
      const fixQuality = parseInt(tokens[6], 10);
      const satCount = tokens[7];
      const hdop = tokens[8];
      const altitude = tokens[9];

      if (!rawLat || !rawLng || isNaN(fixQuality) || fixQuality === 0) {
        return null;
      }

      const latDeg = parseFloat(rawLat.substring(0, 2));
      const latMin = parseFloat(rawLat.substring(2));
      let lat = latDeg + (latMin / 60.0);
      if (latDir === 'S') lat = -lat;

      const lngDeg = parseFloat(rawLng.substring(0, 3));
      const lngMin = parseFloat(rawLng.substring(3));
      let lng = lngDeg + (lngMin / 60.0);
      if (lngDir === 'W') lng = -lng;

      return { lat, lng, fixQuality, satCount, hdop, altitude };
    }

    // ==========================================
    // 4. MQTT 連線
    // ==========================================
    const fixBadge = document.getElementById('fixBadge');
    const posText = document.getElementById('posText');
    const satAltText = document.getElementById('satAltText');
    const updateText = document.getElementById('updateText');
    const btnClear = document.getElementById('btnClear');

    btnClear.addEventListener('click', () => {
      trackLayerGroup.clearLayers();
      if (currentMarker) {
        map.removeLayer(currentMarker);
        currentMarker = null;
      }
      lastPoint = null;
      totalPoints = 0;
      totalDistance = 0;
      document.getElementById('trackStats').innerText = "0 點 / 0.0 m";
      posText.innerText = "已清除";
      satAltText.innerText = "-";
      autoCenter = true;
    });

    function startMQTT() {
      const options = {
        clientId: 'web_marine_' + Math.random().toString(16).substring(2, 10),
        clean: true,
        connectTimeout: 8000,
        reconnectPeriod: 4000
      };

      if (MQTT_CONFIG.username) options.username = MQTT_CONFIG.username;
      if (MQTT_CONFIG.password) options.password = MQTT_CONFIG.password;

      fixBadge.innerText = "連線中...";
      fixBadge.style.backgroundColor = "#ffc107";

      const client = mqtt.connect(MQTT_CONFIG.host, options);

      client.on('connect', () => {
        fixBadge.innerText = "已連線";
        fixBadge.style.backgroundColor = "#17a2b8";
        updateText.innerText = `已訂閱: ${MQTT_CONFIG.topic}`;
        client.subscribe(MQTT_CONFIG.topic);
      });

      client.on('message', (topic, payload) => {
        const msgStr = payload.toString();
        const data = parseGNGGA(msgStr);

        if (data) {
          const modeInfo = fixModes[data.fixQuality] || { text: `模式 ${data.fixQuality}`, color: TRACK_COLOR };
          
          fixBadge.innerText = modeInfo.text;
          fixBadge.style.backgroundColor = (data.fixQuality === 4) ? "#28a745" : ((data.fixQuality === 5) ? "#fd7e14" : "#007bff");
          posText.innerText = `${data.lat.toFixed(7)}, ${data.lng.toFixed(7)}`;
          satAltText.innerText = `衛數: ${data.satCount} | 高程: ${data.altitude}m | HDOP: ${data.hdop}`;
          updateText.innerText = `最後更新: ${new Date().toLocaleTimeString()}`;

          addTrackPoint(data.lat, data.lng, data.fixQuality);
        }
      });

      client.on('error', (err) => {
        fixBadge.innerText = "連線錯誤";
        fixBadge.style.backgroundColor = "#dc3545";
        updateText.innerText = err.message || "連線異常";
      });

      client.on('close', () => {
        fixBadge.innerText = "重連中...";
        fixBadge.style.backgroundColor = "#6c757d";
      });
    }

    window.addEventListener('DOMContentLoaded', startMQTT);
  </script>
</body>
</html>
